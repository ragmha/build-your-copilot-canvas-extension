<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Flip Clock canvas preview</title>
  <desc id="description">A dark split-flap clock showing 10:42 with date and timezone controls.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181818"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="cardBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e0e"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="36" fill="url(#background)"/>
  <rect x="28" y="28" width="1144" height="624" rx="28" fill="none" stroke="#242424"/>
  <text x="76" y="92" fill="#90908b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="2">TUESDAY  ·  SEPTEMBER 8</text>
  <circle cx="1110" cy="82" r="22" fill="#151515" stroke="#303030"/>
  <path d="M1110 70a12 12 0 1 0 0 24 12 12 0 0 0 0-24m0 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10" fill="#a8a8a4"/>
  <g filter="url(#shadow)">
    <g transform="translate(80 140)">
      <rect width="500" height="390" rx="30" fill="#0d0d0d" stroke="#1f1f1f"/>
      <path d="M0 30Q0 0 30 0H470Q500 0 500 30V195H0Z" fill="url(#cardTop)"/>
      <path d="M0 195H500V360Q500 390 470 390H30Q0 390 0 360Z" fill="url(#cardBottom)"/>
      <text x="250" y="301" text-anchor="middle" fill="#bebeba" font-family="Arial Narrow, sans-serif" font-size="255" font-weight="700">10</text>
      <text x="38" y="58" fill="#9b9b97" font-family="system-ui, sans-serif" font-size="22" font-weight="700">PM</text>
      <rect y="191" width="500" height="8" fill="#020202"/>
    </g>
    <g transform="translate(620 140)">
      <rect width="500" height="390" rx="30" fill="#0d0d0d" stroke="#1f1f1f"/>
      <path d="M0 30Q0 0 30 0H470Q500 0 500 30V195H0Z" fill="url(#cardTop)"/>
      <path d="M0 195H500V360Q500 390 470 390H30Q0 390 0 360Z" fill="url(#cardBottom)"/>
      <text x="250" y="301" text-anchor="middle" fill="#bebeba" font-family="Arial Narrow, sans-serif" font-size="255" font-weight="700">42</text>
      <rect y="191" width="500" height="8" fill="#020202"/>
    </g>
  </g>
  <circle cx="84" cy="590" r="5" fill="#d5d5ce"/>
  <text x="104" y="597" fill="#8d8d88" font-family="system-ui, sans-serif" font-size="18" font-weight="650">ASIA / RIYADH</text>
  <text x="1118" y="597" text-anchor="end" fill="#6d6d68" font-family="system-ui, sans-serif" font-size="16" font-weight="650">12 HOUR · ON DEVICE</text>
</svg>
