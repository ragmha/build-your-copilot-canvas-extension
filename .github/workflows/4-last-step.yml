name: Step 4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/extensions/flip-clock/**"

permissions:
  contents: write
  actions: write
  issues: write

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    if: >-
      ${{
        github.repository != 'ragmha/build-your-copilot-canvas-extension' &&
        (
          github.event_name == 'workflow_dispatch' ||
          github.event.head_commit.message != 'Initial commit'
        )
      }}
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  check_step_work:
    name: Grade Step 4
    needs: [find_exercise]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Find progress comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          direction: last

      - name: Show checking status
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Check package and hardening
        id: grade-structure
        continue-on-error: true
        run: node .github/scripts/grade.mjs 4 --cumulative > step-feedback.md

      - name: Run complete module tests
        id: test-modules
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test .github/extensions/flip-clock/tests/*.test.mjs > test-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            printf '\n### Complete test suite\n\n✅ All deterministic module tests passed.\n' >> step-feedback.md
          else
            printf '\n### Complete test suite\n\n❌ One or more module tests failed.\n\n```text\n' >> step-feedback.md
            cat test-output.txt >> step-feedback.md
            printf '```\n' >> step-feedback.md
          fi
          exit "$status"

      - name: Check extension and renderer syntax
        id: check-syntax
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          node --check .github/extensions/flip-clock/extension.mjs > syntax-output.txt 2>&1 || status=$?
          node --check .github/extensions/flip-clock/assets/app.js >> syntax-output.txt 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            printf '\n### Runtime syntax\n\n✅ `extension.mjs` and `assets/app.js` parse successfully.\n' >> step-feedback.md
          else
            printf '\n### Runtime syntax\n\n❌ Fix the extension or renderer syntax error below, then push again.\n\n```text\n' >> step-feedback.md
            cat syntax-output.txt >> step-feedback.md
            printf '```\n' >> step-feedback.md
          fi
          exit "$status"

      - name: Post step results
        if: ${{ always() }}
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: step-feedback.md
          edit-mode: replace

      - name: Fail when a check needs work
        if: |
          steps.grade-structure.outcome == 'failure' ||
          steps.test-modules.outcome == 'failure' ||
          steps.check-syntax.outcome == 'failure'
        run: exit 1

  post_review_content:
    name: Post review
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Mark final step complete
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Add review
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Disable final workflow
        run: |
          gh workflow disable "${{ github.workflow }}" \
            --repo "${{ github.repository }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.1
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Build a Copilot Canvas Extension"
