name: Validate exercise source

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/extensions/flip-clock/**"
      - ".github/images/**"
      - ".github/scripts/**"
      - ".github/steps/**"
      - ".github/tests/**"
      - ".github/workflows/**"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - ".github/extensions/flip-clock/**"
      - ".github/images/**"
      - ".github/scripts/**"
      - ".github/steps/**"
      - ".github/tests/**"
      - ".github/workflows/**"
      - "CODE_OF_CONDUCT.md"
      - "LICENSE"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.repository == 'ragmha/build-your-copilot-canvas-extension' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run exercise and grader tests
        run: node --test .github/extensions/flip-clock/tests/*.test.mjs .github/tests/*.test.mjs

      - name: Check JavaScript syntax
        run: find .github -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Confirm the starter has not advanced
        run: |
          ! node .github/scripts/grade.mjs 1
          ! node .github/scripts/grade.mjs 2
          ! node .github/scripts/grade.mjs 3
          ! node .github/scripts/grade.mjs 4
