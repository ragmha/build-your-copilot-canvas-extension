name: Step 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/extensions/flip-clock/**"

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_3_FILE: ".github/steps/3-step.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    if: >-
      ${{
        github.repository != 'ragmha/build-your-copilot-canvas-extension' &&
        (
          github.event_name == 'workflow_dispatch' ||
          github.event.head_commit.message != 'Initial commit'
        )
      }}
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  check_step_work:
    name: Grade Step 2
    needs: [find_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Find progress comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: "github-actions[bot]"
          direction: last

      - name: Show checking status
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Check renderer lifecycle
        id: grade-structure
        continue-on-error: true
        run: node .github/scripts/grade.mjs 2 --cumulative > step-feedback.md

      - name: Test loopback renderer
        id: test-renderer
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test .github/extensions/flip-clock/tests/server.test.mjs > test-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            printf '\n### Renderer tests\n\n✅ The loopback server tests passed.\n' >> step-feedback.md
          else
            printf '\n### Renderer tests\n\n❌ The loopback server tests failed.\n\n```text\n' >> step-feedback.md
            cat test-output.txt >> step-feedback.md
            printf '```\n' >> step-feedback.md
          fi
          exit "$status"

      - name: Post step results
        if: ${{ always() }}
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: step-feedback.md
          edit-mode: replace

      - name: Fail when a check needs work
        if: |
          steps.grade-structure.outcome == 'failure' ||
          steps.test-renderer.outcome == 'failure'
        run: exit 1

  post_next_step_content:
    name: Post Step 3
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1

      - name: Mark Step 2 complete
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Add Step 3
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Watch for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Advance workflow state
        run: |
          gh workflow disable "${{ github.workflow }}" \
            --repo "${{ github.repository }}" || true
          gh workflow enable "Step 3" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
